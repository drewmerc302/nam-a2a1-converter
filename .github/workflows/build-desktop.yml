name: build-desktop

# Builds the frozen converter for Windows (.zip, unsigned), Windows + CUDA (.zip,
# unsigned), macOS (.dmg, signed + notarized when Apple secrets are present), Linux
# x86_64 (.tar.gz, unsigned), and Linux x86_64 + CUDA (.tar.gz, unsigned).
# Runs on a v* tag and attaches the artifacts to the GitHub Release. Can also be run
# manually to smoke-test the freeze (artifacts uploaded to the run, not a release) —
# do that first after touching the CUDA leg, to read its real packaged size.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            torch_index: cpu
            artifact: nam-a2a1-converter-windows.zip
          # Same build, CUDA torch instead of CPU torch. Shipped as a SEPARATE download
          # rather than folded into the default: the cu126 wheel is ~2.6 GB against the
          # CPU wheel's ~122 MB, so a single universal bundle would make every Mac, AMD
          # and Intel user pay for kernels they cannot run. The app detects an unusable
          # NVIDIA card at runtime (nam_a2a1/accel.py) and links here.
          - os: windows-latest
            platform: win-cuda
            torch_index: cu126
            artifact: nam-a2a1-converter-windows-cuda.zip
          - os: macos-latest
            platform: mac
            # macOS wheels carry MPS support in the standard build, so Apple silicon is
            # already GPU-accelerated with no CUDA leg needed.
            torch_index: cpu
          # Pinned deliberately, NOT ubuntu-latest. A Linux binary's build-time glibc
          # is a *minimum* for the user, not a match requirement: setup-python installs
          # a per-runner-image CPython whose libpython/stdlib .so's carry that image's
          # GLIBC_* symbol versions, and PyInstaller collects them verbatim. Building on
          # 24.04 (glibc 2.39) would produce a binary that refuses to start on Ubuntu
          # 22.04 / Mint 21 / Debian 12 — most of the installed base. 22.04 = glibc 2.35.
          - os: ubuntu-22.04
            platform: linux
            torch_index: cpu
            artifact: nam-a2a1-converter-linux-x86_64.tar.gz
          # Linux NVIDIA users were being shown the GPU banner and sent to a Windows-only
          # download (reported 2026-07-28). Same separate-download reasoning as win-cuda.
          # Expect this bundle to be LARGER than the Windows one: the Linux cu126 wheel
          # pulls the CUDA runtime in as separate nvidia-* wheels, which PyInstaller then
          # collects individually. Same 22.04 pin, for the same glibc reason as above.
          - os: ubuntu-22.04
            platform: linux-cuda
            torch_index: cu126
            artifact: nam-a2a1-converter-linux-x86_64-cuda.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      # Highest GLIBC_* symbol version the Linux build may require. Enforced below so a
      # runner-image bump can't silently raise the floor and strand users.
      LINUX_GLIBC_FLOOR: "2.35"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # neural-amp-modeler imports tkinter at module load (nam/train/core.py), and
      # nam.models pulls nam.train transitively — so the freeze must be able to collect
      # _tkinter. The tool-cache CPython links it against the SYSTEM Tcl/Tk, which the
      # runner image does not ship; without this the frozen selftest fails on import.
      #
      # No disk-cleanup step here despite the cu126 leg being the heaviest thing this
      # workflow builds: measured 2026-07-28, the ubuntu-22.04 runner starts with 87 GB
      # free and the whole linux-cuda leg (site-packages + dist/ + a 3.5 GB tarball)
      # needs well under 20 GB of it. Removing dotnet/android/ghc bought nothing.
      - name: Install Tcl/Tk (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libtk8.6 libtcl8.6
          python -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Install deps (${{ matrix.torch_index }} torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/${{ matrix.torch_index }}
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import torch; print('torch', torch.__version__, 'cuda build:', torch.version.cuda)"

      - name: Freeze
        shell: bash
        run: pyinstaller --noconfirm build/nam-a2a1-converter.spec

      # Run the FROZEN binary to force the full import graph — catches missing
      # bundled modules (tkinter, matplotlib, torch bits) in CI, not on a user's box.
      - name: Smoke-test frozen imports
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="dist/nam-a2a1-converter/nam-a2a1-converter.exe"
          else
            EXE="dist/nam-a2a1-converter/nam-a2a1-converter"
          fi
          "$EXE" selftest
          # The accel probe is what the UI's GPU banner is built on; assert the frozen
          # exe answers it, and that the CUDA leg really did bundle CUDA torch. A cu126
          # build that silently froze the CPU wheel would ship a 2.6 GB download that
          # trains no faster than the default one.
          echo "accel: $("$EXE" accel)"
          if [ "${{ matrix.torch_index }}" != "cpu" ]; then
            "$EXE" accel | grep -q '"cuda_build": true' || {
              echo "::error::${{ matrix.platform }} bundle reports cuda_build=false — it froze a non-CUDA torch"
              exit 1
            }
          fi

      # soundfile resolves its native lib at import: it imports the SEPARATE top-level
      # package `_soundfile_data` and loads libsndfile_<machine>.so from it — and on any
      # failure falls back SILENTLY to the system libsndfile via ctypes.util.find_library.
      # The runner has a system libsndfile, so a bundle that's missing it still passes the
      # selftest and then dies on the user's machine at the first render. Assert it here.
      - name: Verify libsndfile is bundled (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          want="dist/nam-a2a1-converter/_internal/_soundfile_data/libsndfile_$(uname -m).so"
          if [ ! -f "$want" ]; then
            echo "::error::missing $want — soundfile would fall back to the system libsndfile, which users don't have. Found instead:"
            find dist/nam-a2a1-converter -name 'libsndfile*' -o -name '_soundfile_data' || true
            exit 1
          fi
          echo "ok: $want"

      # Guard the glibc floor. The binary runs on the build image's glibc *or newer*, so
      # the highest GLIBC_* symbol version anything in the bundle imports IS the minimum
      # distro version. Fails loudly if a runner-image change pushes it past the floor.
      - name: Verify glibc floor (Linux)
        run: |
          max=$(find dist/nam-a2a1-converter -type f \
                  \( -name '*.so' -o -name '*.so.*' -o -name 'nam-a2a1-converter' \) -print0 \
                | xargs -0 -r objdump -T 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' \
                | sort -uV | tail -1)
          echo "highest required glibc: ${max:-none} (floor $LINUX_GLIBC_FLOOR)"
          if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$LINUX_GLIBC_FLOOR" "$max" | sort -V | tail -1)" != "$LINUX_GLIBC_FLOOR" ]; then
            echo "::error::bundle requires glibc $max > floor $LINUX_GLIBC_FLOOR — it will not start on the distros this build targets"
            exit 1
          fi
        if: startsWith(matrix.platform, 'linux')

      # ---------- Linux: tar the onedir ----------
      # tar, NOT zip: Compress-Archive drops Unix mode bits, and actions/upload-artifact
      # re-zips its input without preserving permissions. Either one strips the exec bit
      # and the user gets "Permission denied". tar stores the mode inside the archive, so
      # it survives the artifact re-zip intact.
      - name: Package (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          tar -czf "${{ matrix.artifact }}" -C dist nam-a2a1-converter
          ls -lh "${{ matrix.artifact }}"

      # ---------- Windows: zip the onedir (both the CPU and CUDA legs) ----------
      # 7z, NOT Compress-Archive: the latter is documented to top out around 2 GB
      # (System.IO.Compression limits), and the CUDA bundle is comfortably past that.
      # 7z is preinstalled on the Windows runners and -tzip keeps the output a plain
      # .zip that Explorer opens with no extra tooling.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          7z a -tzip -mx=5 "${{ matrix.artifact }}" ".\dist\nam-a2a1-converter\*"
          "{0} -> {1:N0} MiB" -f "${{ matrix.artifact }}", ((Get-Item "${{ matrix.artifact }}").Length / 1MB)

      # GitHub caps a SINGLE release asset at 2 GiB, but allows up to 1000 assets with no
      # cap on total release size — so an oversized bundle ships as parts. Measured
      # 2026-07-26: the CPU zip is ~353 MiB (one asset), the CUDA zip 2,667 MiB (two).
      # Measured 2026-07-28: the Linux CPU tarball is ~447 MiB (one), the Linux CUDA
      # tarball 3,564 MiB (THREE) — bigger than the Windows CUDA bundle because the
      # Linux cu126 wheel brings the CUDA runtime along as separate nvidia-* wheels.
      # Part count is derived from PART_MIB, never hardcoded, so this needs no edit when
      # a torch bump moves the size again.
      #
      # Raw byte split, NOT `7z -v` multi-volume: Explorer cannot open a multi-volume zip,
      # so that route forces every user to install 7-Zip before they can start. Raw parts
      # rejoin with tooling every user already has — cmd's built-in `copy /b` on Windows
      # (or get-cuda-build.ps1), plain `cat` on Linux.
      #
      # Runs for every leg that produces a named artifact, not just Windows: `if` keys off
      # matrix.artifact, which the macOS leg deliberately does not set (it ships a .dmg,
      # built and attached by its own step).
      - name: Split oversized artifact
        if: matrix.artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          ART="${{ matrix.artifact }}"
          LIMIT_MIB=2000   # under 2 GiB with headroom
          PART_MIB=1400    # keeps the Windows CUDA zip at exactly two parts

          # The ASSEMBLED archive's checksum is the one that matters: it is what the user
          # must end up with after rejoining, and a silently truncated part is otherwise
          # undebuggable from the far end of a multi-GB download. Per-part sums let them
          # find WHICH download went wrong instead of refetching everything.
          sha256sum "$ART" | tee "$ART.sha256"

          size_mib=$(( $(wc -c < "$ART") / 1048576 ))
          if [ "$size_mib" -le "$LIMIT_MIB" ]; then
            echo "$ART is ${size_mib} MiB — fits as a single asset, not splitting"
            exit 0
          fi

          echo "$ART is ${size_mib} MiB — splitting into ${PART_MIB} MiB parts"
          split -b "${PART_MIB}m" -d -a 3 --numeric-suffixes=1 "$ART" "$ART."
          rm -f "$ART"   # do not also upload the whole file; it cannot be attached anyway
          sha256sum "$ART".[0-9][0-9][0-9] | tee -a "$ART.sha256"
          ls -l "$ART".[0-9][0-9][0-9]
          for p in "$ART".[0-9][0-9][0-9]; do
            pm=$(( $(wc -c < "$p") / 1048576 ))
            [ "$pm" -le "$LIMIT_MIB" ] || {
              echo "::error::part $p is ${pm} MiB — still over the cap; lower PART_MIB"
              exit 1
            }
          done

      # ---------- macOS: sign + dmg + notarize ----------
      - name: Package (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PW: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -e
          APP_DIR="dist/nam-a2a1-converter"
          DMG="nam-a2a1-converter-macos.dmg"

          if [ -n "$CERT_B64" ]; then
            echo "signing…"
            KEYCHAIN=build.keychain
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            echo "$CERT_B64" | base64 --decode > cert.p12
            security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

            # Sign by the identity's SHA-1 hash (robust to a cosmetic key label like
            # "jobPilot signing"), and require it to be a Developer ID Application cert.
            security find-identity -v -p codesigning "$KEYCHAIN"
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -oE '[0-9A-F]{40}')
            if [ -z "$IDENTITY" ]; then
              echo "::error::No codesigning identity in the .p12 — export the 'Developer ID Application' CERTIFICATE row (not the private-key row) into MACOS_CERT_P12_BASE64."
              exit 1
            fi
            if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
              echo "::error::Imported identity is not a 'Developer ID Application' cert — notarization will reject it."
              exit 1
            fi
            echo "using identity hash: $IDENTITY"

            # Sign EVERY Mach-O binary (not just .dylib/.so), inner ones first, with
            # hardened runtime + a secure timestamp — anything unsigned fails notarization.
            while IFS= read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --timestamp --options runtime --sign "$IDENTITY" "$f"
              fi
            done < <(find "$APP_DIR" -type f | sort -r)
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$APP_DIR/nam-a2a1-converter"
          else
            echo "no signing secrets — building unsigned dmg"
          fi

          hdiutil create -volname "NAM A2A1 Converter" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG"

          if [ -n "$CERT_B64" ] && [ -n "$API_KEY_B64" ]; then
            echo "notarizing…"
            echo "$API_KEY_B64" | base64 --decode > api_key.p8
            SUBMIT=$(xcrun notarytool submit "$DMG" \
              --key api_key.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait 2>&1)
            echo "$SUBMIT"
            SUB_ID=$(echo "$SUBMIT" | grep -m1 -oE '  id: [0-9a-f-]+' | awk '{print $2}')
            if echo "$SUBMIT" | grep -q "status: Invalid"; then
              echo "::group::notarization log"
              xcrun notarytool log "$SUB_ID" \
                --key api_key.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER" || true
              echo "::endgroup::"
              exit 1
            fi
            xcrun stapler staple "$DMG"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nam-a2a1-converter-${{ matrix.platform }}
          path: |
            nam-a2a1-converter-windows.zip
            nam-a2a1-converter-windows-cuda.zip
            nam-a2a1-converter-windows-cuda.zip.*
            nam-a2a1-converter-macos.dmg
            nam-a2a1-converter-linux-x86_64.tar.gz
            nam-a2a1-converter-linux-x86_64-cuda.tar.gz
            nam-a2a1-converter-linux-x86_64-cuda.tar.gz.*
            *.sha256
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nam-a2a1-converter-windows.zip
            nam-a2a1-converter-windows-cuda.zip
            nam-a2a1-converter-windows-cuda.zip.*
            nam-a2a1-converter-macos.dmg
            nam-a2a1-converter-linux-x86_64.tar.gz
            nam-a2a1-converter-linux-x86_64-cuda.tar.gz
            nam-a2a1-converter-linux-x86_64-cuda.tar.gz.*
            *.sha256
          fail_on_unmatched_files: false
